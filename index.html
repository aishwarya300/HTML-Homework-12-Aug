<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <center><h1>Welcome to Instagram Login Page</h1></center> <hr>

    <center>
    <table border="3px" style="border-collapse: collapse;">
    
        <form action="#sai-baba">

            <tr>
                <td> Name:</td>
                <td><input type="text" placeholder="Enter your name" required> <br><br></td>
            </tr>

            <tr>
                <td> Password:</td>
                <td><input type="password" placeholder="Enter password" required> <br><br></td>
            </tr>

            <tr>
                <td> DOB:</td>
                <td><input type="date" placeholder="Enter DOB" required> <br><br></td>
            </tr>

            <tr>
                <td>  Upload your photo:</td>
                <td><input type="file" placeholder="Upload your photo" required> <br><br><br></td>
            </tr>

            <tr>
                <td colspan="2" align="center">
                  <br><button type="submit">submit</button><br><br>
                </td>
            </tr>
            
        </form>
    
    </table>
    </center>
    
</body>
</html>
